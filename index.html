    <script>
      // Suppress benign [vite] websocket connection errors in AI Studio sandboxed preview
      (function() {
        function isBenignSystemError(val) {
          if (!val) return false;
          var str = '';
          if (typeof val === 'string') {
            str = val;
          } else if (val instanceof Error || (val && typeof val === 'object' && val.message)) {
            str = (val.message || '') + ' ' + (val.stack || '') + ' ' + (val.name || '');
          } else {
            try { str = JSON.stringify(val); } catch(e) { str = String(val); }
          }
          var lower = str.toLowerCase();
          return lower.indexOf('[vite]') !== -1 || 
                 lower.indexOf('vite:') !== -1 || 
                 lower.indexOf('vite-hmr') !== -1 || 
                 lower.indexOf('websocket') !== -1 ||
                 lower.indexOf('could not reach cloud firestore backend') !== -1 ||
                 lower.indexOf('client will operate in offline mode') !== -1 ||
                 lower.indexOf('backend didn\'t respond within 10 seconds') !== -1 ||
                 lower.indexOf('@firebase/firestore') !== -1;
        }

        // Intercept WebSocket creation for Vite HMR to prevent failing browser network connections
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            function MockViteWebSocket(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
              var isVite = protoStr.indexOf('vite-hmr') !== -1 ||
                           protoStr.indexOf('vite-ping') !== -1 ||
                           urlStr.indexOf('token=') !== -1 ||
                           urlStr.indexOf('24678') !== -1 ||
                           urlStr.indexOf('@vite') !== -1;

              if (!isVite) {
                return new OrigWebSocket(url, protocols);
              }

              var target = new EventTarget();
              target.url = urlStr;
              target.protocol = protoStr;
              target.readyState = 0;
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
              };

              setTimeout(function() {
                target.readyState = 1;
                var evt = new Event('open');
                target.dispatchEvent(evt);
                if (typeof target.onopen === 'function') {
                  try { target.onopen(evt); } catch(e) {}
                }
              }, 5);

              return target;
            }

            MockViteWebSocket.CONNECTING = 0;
            MockViteWebSocket.OPEN = 1;
            MockViteWebSocket.CLOSING = 2;
            MockViteWebSocket.CLOSED = 3;
            MockViteWebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket = MockViteWebSocket;
          }
        } catch(err) {}

        window.addEventListener('error', function(e) {
          if (isBenignSystemError(e) || isBenignSystemError(e.message) || isBenignSystemError(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isBenignSystemError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        ['error', 'warn', 'info', 'log', 'debug'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isBenignSystemError(arguments[i])) {
                return;
              }
            }
            if (orig) orig.apply(console, arguments);
          };
        });
      })();
    </script>
